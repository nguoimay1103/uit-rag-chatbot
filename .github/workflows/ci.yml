name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-prod.txt

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-prod.txt

      - name: Compile Python sources
        run: python -m compileall -q backend scripts tests

      - name: Run offline unit tests
        run: >-
          python -m unittest -v
          tests.test_fusion
          tests.test_cache
          tests.test_database
          tests.test_publish_benchmark
