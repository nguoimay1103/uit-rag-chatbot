services:
  backend:
    build: ./backend
    container_name: uit_rag_backend
    ports:
      - "8000:8000"
    env_file:
      - .env  # Nạp các biến OPENAI_API_KEY, QDRANT_URL, QDRANT_API_KEY
    environment:
      - BM25_PATH=/app/data/processed/bm25_retriever.pkl
    networks:
      - rag_network
    restart: unless-stopped
    volumes:
      - ./backend:/app # Ánh xạ thư mục để khi bạn sửa code Python, container tự cập nhật
      - ./data:/app/data

  frontend:
    build: ./frontend
    container_name: uit_rag_frontend
    ports:
      - "8501:80"
    depends_on:
      - backend
    networks:
      - rag_network
    restart: unless-stopped

networks:
  rag_network:
    driver: bridge
